name: Check for new Limusic release and trigger COPR rebuild

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch: {}    # allow manual runs too

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest Limusic release tag
        id: latest
        run: |
          TAG=$(curl -s https://api.github.com/repos/SimoHypers/limusic/releases/latest | jq -r .tag_name)
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get latest successfully built COPR version
        id: copr
        run: |
          RESPONSE=$(curl -s "https://copr.fedorainfracloud.org/api_3/package/list?ownername=oguzkarayemis&projectname=limusic&with_latest_build=true")
          # source_package.version is "VERSION-RELEASE" (e.g. "0.7.3-1"); only take the version part
          BUILT=$(echo "$RESPONSE" | jq -r '.items[0].builds.latest | select(.state=="succeeded") | .source_package.version' | cut -d'-' -f1)
          echo "built=$BUILT" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.copr.outputs.built }}" != "${{ steps.latest.outputs.version }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger COPR rebuild
        if: steps.compare.outputs.changed == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::COPR_WEBHOOK_URL secret is empty or missing."
            exit 1
          fi
          HTTP_STATUS=$(curl -sS -o /tmp/copr_response.txt -w "%{http_code}" -X POST "$WEBHOOK_URL")
          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/copr_response.txt
          if [ "$HTTP_STATUS" -ge 400 ]; then
            exit 1
          fi
